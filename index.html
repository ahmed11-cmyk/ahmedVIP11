  const err=document.getElementById('err'); if(!email||!pass){ if(err){ err.textContent='أدخل البيانات'; err.classList.remove('hidden'); } return; } if(pass.length<6){ if(err){ err.textContent='الباسورد 6+'; err.classList.remove('hidden'); } return; }
  try{ await setPersistence(auth, browserLocalPersistence); if(s.login==='register'){const c=await createUserWithEmailAndPassword(auth,email,pass); await set(ref(db,`users/${c.user.uid}`),{uid:c.user.uid,email,displayName:name,photoURL:'',ip:s.ip,lastIP:s.ip,createdAt:Date.now(),totalSpins:0}); if(email===SPECIAL_ADMIN){await set(ref(db,`admins/${c.user.uid}`),{email,role:'special'});} } else {await signInWithEmailAndPassword(auth,email,pass); await update(ref(db,`users/${auth.currentUser.uid}`),{lastIP:s.ip,lastLogin:Date.now()}); if(email===SPECIAL_ADMIN){await set(ref(db,`admins/${auth.currentUser.uid}`),{email,role:'special'});} } }catch(e){ if(err){ err.textContent=e.code==='auth/email-already-in-use'?'مستخدم':e.message; err.classList.remove('hidden'); } }

window.banUser=async(uid)=>{if(confirm('تحظر الحساب؟')){await set(ref(db,`banned_users/${uid}`),{uid,bannedAt:Date.now()}); alert('تم الحظر');}};
window.resetAllToday=async()=>{
  if(!confirm('تصفر محاولات اليوم للكل؟')) return;
  const today=new Date().toISOString().split('T')[0];
  const snap=await get(ref(db,'spins'));
  if(!snap.val()){ alert('لا يوجد'); return; }
  let count=0; const promises=[];
  for(const [key,val] of Object.entries(snap.val())){
    if(new Date(val.timestamp).toISOString().split('T')[0]===today){
      promises.push(remove(ref(db,`spins/${key}`))); count++;
    }
  }
  await Promise.all(promises);
  alert(`✅ تم تصفير ${count}`);
  s.today=false; render();
};
window.resetUserAttempts=async(uid)=>{
  if(!confirm('تصفر محاولات هذا المستخدم؟')) return;
  const today=new Date().toISOString().split('T')[0];
  const snap=await get(ref(db,'spins'));
  let count=0; const promises=[];
  for(const [key,val] of Object.entries(snap.val()||{})){
    if(val.uid===uid && new Date(val.timestamp).toISOString().split('T')[0]===today){
      promises.push(remove(ref(db,`spins/${key}`))); count++;
    }
  }
  await Promise.all(promises);
  alert(`✅ تم تصفير ${count}`);
};
window.resetAllSpins=async()=>{
  if(!confirm('تصفر كل المحاولات؟')) return;
  if(!confirm('تأكيد ثاني؟')) return;
  await remove(ref(db,'spins')); alert('تم حذف الكل'); s.today=false; render();

window.setQuickPresets=()=>{
  const c=prompt('1=نادر جدا 1%\n2=متوازن 5%\n3=كريم 20%');
  if(c==='1'){ s.prizes.forEach(p=>{ if(p.id==='hard') p.weight=95; else p.weight=0.8; }); }

  else if(c==='3'){ s.prizes.forEach(p=>{ if(p.id==='hard') p.weight=80; else p.weight=3.3; }); }

window.savePrizes=async()=>{
  const total=s.prizes.reduce((a,b)=>a+Number(b.weight),0);
  if(Math.abs(total-100)>0.5){ if(!confirm(`المجموع ${total.toFixed(1)}% مو 100% - تحفظ؟`)) return; }
  try{await set(ref(db,'settings/prizes'),s.prizes); alert(`✅ تم حفظ النسب ${total.toFixed(1)}% - فعال فوراً`);}catch(e){alert(e.message);}};
window.toggleMaintenance=async(v)=>{await set(ref(db,'settings/maintenance'),v);};
window.updateSetting=async(k,v)=>{await set(ref(db,`settings/${k}`),v);};
window.spin=async()=>{
  if(s.guest){ alert('سجل دخولك'); return; }
  if(s.today){ alert('لعبت اليوم'); return; }
  if(s.spinning) return;
  s.spinning=true;
  const btn=document.getElementById('spinBtn');
  if(btn){ btn.disabled=true; btn.textContent='⏳ جاري...'; }
  const idx=wrand();
  const prize=s.prizes[idx];
  const ang=360/s.prizes.length;
  const center = idx*ang + ang/2;
  const toTop = (360 - center + 360) % 360;
  const target = 360*6 + toTop + (Math.random()*8-4);
  s.rot = (s.rot + target) % 3600;
  const wheelEl=document.getElementById('wheel');
  if(wheelEl){
    wheelEl.style.transition='none';
    void wheelEl.offsetWidth;
    wheelEl.style.transition='transform 4.5s cubic-bezier(0.18,0.82,0.12,1)';
    wheelEl.style.transform=`rotate(${s.rot}deg)`;
  }
  setTimeout(async()=>{
    s.spinning=false;
    if(btn){ btn.disabled=false; }
    const code=genCode();
    const modal=document.getElementById('resultModal');
    const content=document.getElementById('resultContent');
    const rare=prize.name!=='حظ أوفر';
    if(content){
      content.innerHTML=`<div class="text-5xl mb-4">${rare?'🎉':'💔'}</div>${prize.image?`<img src="${prize.image}" class="w-24 h-24 mx-auto rounded-2xl mb-4 object-cover">`:''}<h3 class="font-black mb-2 text-[16px]">${rare?'مبروك! فزت':'حظ أوفر'}</h3><p class="text-[15px] font-bold text-[#fbbf24] mb-4">${prize.name}</p>${rare?`<div class="bg-[#fbbf24]/10 border border-[#fbbf24]/20 p-3 rounded-xl mb-4"><p class="text-[10px] text-white/40">كود الاستلام</p><p class="font-mono font-black text-[#fbbf24] text-sm">${code}</p></div>`:''}<div class="space-y-2">${rare?`<a href="https://t.me/${s.telegram.replace('@','')}?text=فزت ${encodeURIComponent(prize.name)} - ${code}" target="_blank" class="block bg-white text-black py-3.5 rounded-full font-black text-sm">📩 استلام عبر ${s.telegram}</a>`:''}<button onclick="window.closeResult()" class="w-full bg-white/10 py-3 rounded-full text-sm font-bold">إغلاق</button></div>`;
    }
    if(modal){ modal.classList.remove('hidden'); modal.classList.add('flex'); }
    if(s.user){
      try{
        await push(ref(db,'spins'),{uid:s.user.uid,email:s.user.email,displayName:s.user.displayName||s.user.email,prizeName:prize.name,prizeId:prize.id,timestamp:Date.now(),ip:s.ip, code: rare?code:'', delivered:false});
        const uref=ref(db,`users/${s.user.uid}`); const snap=await get(uref); const cur=snap.val()||{}; await update(uref,{totalSpins:(cur.totalSpins||0)+1,lastSpin:Date.now(),lastIP:s.ip,ip:s.ip});
        s.today=true;
      }catch(e){ console.log(e); }
    }
    if(btn){ btn.textContent=s.today?'✅ لعبت اليوم - باجر':'🎡 إبدأ اللعب'; btn.disabled=s.today; }
  },4600);
};
window.closeResult=()=>{ const m=document.getElementById('resultModal'); if(m){ m.classList.add('hidden'); m.classList.remove('flex'); } render(); };
let taps=[]; document.addEventListener('click',e=>{const logo=e.target.closest('#logo'); if(logo){const now=Date.now(); taps=taps.filter(t=>now-t<3000); taps.push(now); if(taps.length>=5){taps=[]; if(s.admin){s.showAdmin=true;render();} else {const code=prompt('كود الأدمن:'); if(code==='AHMED2026'&&s.user){set(ref(db,`admins/${s.user.uid}`),{email:s.user.email,role:'admin'}).then(()=>{s.admin=true; render();});}}}}});
(async()=>{
  const ip=await getIP();
  onAuthStateChanged(auth, async(user)=>{
    s.user=user;
    if(user){
      s.guest=false;
      try{
        const adminSnap=await get(ref(db,`admins/${user.uid}`));
        s.admin=!!adminSnap.val() || user.email===SPECIAL_ADMIN;
        const banSnap=await get(ref(db,`banned_users/${user.uid}`));
        if(banSnap.val()){document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-6"><div class="card p-8 rounded-[20px] text-center"><div class="text-3xl mb-3">🚫</div><h1 class="font-black text-sm">محظور</h1></div></div>`;return;}
        if(ip){ const ipBan=await get(ref(db,`banned_ips/${ip.replace(/\./g,'_')}`)); if(ipBan.val()){document.getElementById('app').innerHTML=`<div class="min-h-screen flex items-center justify-center p-6"><div class="card p-8 rounded-[20px] text-center"><div class="text-3xl mb-3">🚫</div><h1 class="font-black text-sm">IP محظور</h1></div></div>`;return;} }
        const today=new Date().toISOString().split('T')[0]; const sp=await get(ref(db,'spins')); if(sp.val()){const all=Object.values(sp.val()); const t=all.filter(x=>x.uid===user.uid && new Date(x.timestamp).toISOString().split('T')[0]===today); s.today=t.length>0; }
      }catch(e){ console.log(e); }
    }
    render();
  });
})();
onValue(ref(db,'settings/maintenance'),x=>{s.maintenance=!!x.val();render();});
onValue(ref(db,'settings/maintenanceMessage'),x=>{if(x.val()) s.msg=x.val();});
onValue(ref(db,'settings/telegram'),x=>{if(x.val()) s.telegram=x.val();});
onValue(ref(db,'settings/broadcast'),x=>{s.broadcast=x.val()||'';render();});
onValue(ref(db,'settings/prizes'),x=>{if(x.val()&&Array.isArray(x.val())&&x.val().length>0){s.prizes=x.val();render();}});
onValue(ref(db,'spins'),x=>{
  const val=x.val()||{};
  const arr=Object.entries(val).map(([k,v])=>({...v, key:k}));
  s.spins=arr;
  if(s.user && !s.spinning){
    const today=new Date().toISOString().split('T')[0];
    const t=arr.filter(v=>v.uid===s.user.uid && new Date(v.timestamp).toISOString().split('T')[0]===today);
    const was=s.today;
    s.today=t.length>0;
    if(was!==s.today && !s.spinning){ render(); }
  }
  if(s.showAdmin) renderAdmin();
});
onValue(ref(db,'users'),x=>{s.users=x.val()?Object.values(x.val()):[]; if(s.showAdmin) render();});
onValue(ref(db,'banned_ips'),x=>{s.banned=x.val()||{}; if(s.showAdmin) render();});
render();
