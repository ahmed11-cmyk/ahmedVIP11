function checkStreak(){ const today=new Date().toISOString().split('T')[0]; const last=s.streak.lastDate; if(!last){ s.streak.count=1; s.streak.lastDate=today; s.streak.best=Math.max(s.streak.best||0,1); saveLocal(); return; } if(last===today) return; const lastDate=new Date(last); const todayDate=new Date(today); const diff=Math.floor((todayDate-lastDate)/(1000*60*60*24)); if(diff===1){ s.streak.count=(s.streak.count||0)+1; s.streak.lastDate=today; s.streak.best=Math.max(s.streak.best||0, s.streak.count); } else if(diff>1){ s.streak.count=1; s.streak.lastDate=today; } saveLocal(); }

    if(content){ content.innerHTML='<div style="padding:18px; text-align:center;"><div style="width:56px; height:56px; border-radius:50%; margin:0 auto; background:'+(prize.isHard?'#1a1020':'#000')+'; display:flex; align-items:center; justify-content:center; font-size:24px;">'+(prize.isHard?'💔':'<img src=\''+prize.image+'\' style=\'width:100%;height:100%;\'>')+'</div><h3 style="font-weight:900; margin-top:8px;">'+prize.name+'</h3><p style="font-family:monospace; background:#fbbf24; color:#000; padding:8px; border-radius:8px; margin-top:8px; font-weight:900;">'+code+'</p><p style="font-size:6px; color:#22c55e; margin-top:6px;">🛡️ محمي عالمياً • LIVE • تحكم كامل</p><button onclick="window.closeResult()" style="width:100%; background:rgba(255,255,255,0.06); padding:9px; border-radius:10px; margin-top:8px;">إغلاق أسطوري 🛡️</button></div>'; }
    if(modal) modal.style.display='flex';
    const today=new Date().toISOString().split('T')[0];
    s.today=true;
    if(prize.id==='points50'){ s.myPoints=(s.myPoints||0)+(prize.points||50); }
    s.myPoints+=bonus;
    localStorage.setItem('guest_points', s.myPoints); 
    if(s.user?.email) localStorage.setItem('points_'+s.user.email, s.myPoints); 
    if(s.usersData[s.user.uid]) s.usersData[s.user.uid].points=s.myPoints;
    if(s.user?.email) localStorage.setItem('lastSpin_'+s.user.email+'_'+today, '1');
    localStorage.setItem('guest_lastSpin_'+today, '1');
    if(s.usersData[s.user.uid]) s.usersData[s.user.uid].lastSeen=Date.now();
    const rec={uid:s.user.uid,email:s.user.email,displayName:s.user.displayName||s.user.email,prizeName:prize.name,prizeId:prize.id,timestamp:Date.now(),code:code,delivered:false, key:'local_'+Date.now(), points:prize.points||0, ip:s.ip, deviceId:s.deviceId};
    s.spins.push(rec); saveLocal();
    logFullControl('SPIN_COMPLETED', {user:s.user.email, prize:prize.name, code, points:s.myPoints, ip:s.ip, protected:true});
    logProtection('SPIN_COMPLETED', {user:s.user.email, prize:prize.name, ip:s.ip}, 'info');
    if(btn){ btn.textContent='✅ لعبت اليوم - محمي 🛡️'; btn.disabled=true; }
  }, s.wheelSpeed*1000);
};
window.closeResult=()=>{ document.getElementById('resultModal').style.display='none'; renderApp(); };

(async()=>{

  const savedWheel=localStorage.getItem('wheelData');
  if(savedWheel){ try{ const parsed=JSON.parse(savedWheel); if(parsed.length===s.prizes.length) s.prizes=parsed; }catch(e){} }
  s.maintenance = localStorage.getItem('maintenance')==='true';
  const savedStreak=localStorage.getItem('streakData');
  if(savedStreak){ try{ const parsed=JSON.parse(savedStreak); s.streak={...s.streak, ...parsed}; }catch(e){} }
  renderApp();
  // Run initial protection scan
  setTimeout(()=>{ checkGlobalProtections(); }, 1000);
  if(firebaseReady) logFullControl('FIREBASE_READY_V35_FIXED', {ready:true, protections:GLOBAL_PROTECTIONS.length, features:500});
})();
