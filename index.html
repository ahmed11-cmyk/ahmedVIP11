function genId(){ let id=localStorage.getItem('ahmed_vip_device_id'); if(!id){ id='dev_'+Math.random().toString(36).substring(2,15)+Date.now(); localStorage.setItem('ahmed_vip_device_id',id);} return id; }
function wrand(){ const visible = s.prizes.filter(p=>p.visible!==false); let t=visible.reduce((a,b)=>a+b.weight,0); let r=Math.random()*t; let c=0; for(let i=0;i<s.prizes.length;i++){ if(s.prizes[i].visible===false) continue; c+=s.prizes[i].weight; if(r<=c) return i; } return s.prizes.length-1; }
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)]; c+='-'+Math.floor(1000+Math.random()*9000)+'-'+Date.now().toString().slice(-4); return 'VIP-'+c; }
function fireConfetti(){ if(typeof confetti==='function') confetti({particleCount:130, spread:65, origin:{y:0.6}}); }

window.buyPrize=(prizeId, price)=>{ if(s.myPoints<price){ alert('غير كافي'); return; } if(!confirm('تشتري '+s.prizes.find(p=>p.id===prizeId)?.name+' بـ '+price+'؟')) return; const prize=s.prizes.find(p=>p.id===prizeId); const code=genCode(); s.myPoints-=price; localStorage.setItem('guest_points', s.myPoints); if(s.user?.email) localStorage.setItem('points_'+s.user.email, s.myPoints); if(s.usersData[s.user.uid]) s.usersData[s.user.uid].points=s.myPoints; const rec={uid:s.user.uid,email:s.user.email,displayName:s.user.displayName||s.user.email,prizeName:prize.name,prizeId:prize.id,timestamp:Date.now(),code:code,delivered:false, fromStore:true, price:price, key:'local_'+Date.now()}; s.spins.push(rec); saveLocal(); fireConfetti(); const modal=document.getElementById('resultModal'); const content=document.getElementById('resultContent'); if(content){ content.innerHTML='<div style="padding:16px; text-align:center;"><div style="width:52px; height:52px; border-radius:50%; margin:0 auto; overflow:hidden;"><img src="'+prize.image+'" style="width:100%;height:100%;"></div><h3 style="font-weight:900; margin-top:8px;">تم الشراء!</h3><p style="font-family:monospace; background:#fbbf24; color:#000; padding:8px; border-radius:8px; margin-top:8px; font-weight:900;">'+code+'</p><button onclick="window.closeResult()" style="width:100%; background:rgba(255,255,255,0.06); padding:9px; border-radius:9999px; margin-top:8px;">إغلاق</button></div>'; } if(modal) modal.style.display='flex'; renderApp(); };
window.spin=()=>{
  if(s.today){ alert('لعبت اليوم'); return; }
  if(s.spinning) return;
  if(s.minPointsToSpin>0 && s.myPoints<s.minPointsToSpin){ alert('تحتاج '+s.minPointsToSpin+' نقطة للدوران'); return; }
  s.spinning=true; const btn=document.getElementById('spinBtn'); if(btn){ btn.disabled=true; btn.textContent='⏳ جاري...'; }
  const idx=wrand(); const prize=s.prizes[idx]; const ang=360/s.prizes.length; const center=idx*ang+ang/2; const toTop=(360-center+360)%360; const target=360*8+toTop; s.rot=(s.rot+target)%3600;
  const wheelEl=document.getElementById('wheel');
  if(wheelEl){ wheelEl.style.transition='none'; void wheelEl.offsetWidth; wheelEl.style.transition='transform '+s.wheelSpeed+'s cubic-bezier(0.1,0.8,0.1,1)'; wheelEl.style.transform='rotate('+s.rot+'deg)'; }
  setTimeout(()=>{
    s.spinning=false; if(btn){ btn.disabled=false; }
    if(prize.name!=='حظ أوفر') fireConfetti();
    const code=genCode();
    const modal=document.getElementById('resultModal'); const content=document.getElementById('resultContent');
    if(content){
      const isHard = prize.id==='hard';
      content.innerHTML='<div style="padding:16px; text-align:center;"><div style="width:68px; height:68px; border-radius:50%; margin:0 auto; overflow:hidden; background:'+(isHard?'radial-gradient(circle, #1a1020, #0a0a1e)':'#000')+'; border:2px solid '+(isHard?'rgba(239,68,68,0.3)':'rgba(251,191,36,0.2)')+';"><img src="'+prize.image+'" style="width:100%;height:100%;object-fit:cover;"></div><div style="font-size:26px; margin-top:8px;">'+(isHard?'💔':'🎉')+'</div><h3 style="font-weight:900; margin-top:4px; color:'+(isHard?'#fca5a5':'#fff')+';">'+prize.name+'</h3><p style="font-family:monospace; background:#fbbf24; color:#000; padding:8px; border-radius:8px; margin-top:8px; font-weight:900;">'+code+'</p><button onclick="window.closeResult()" style="width:100%; background:rgba(255,255,255,0.06); padding:9px; border-radius:9999px; margin-top:8px;">إغلاق</button></div>';
    }
    if(modal) modal.style.display='flex';
    const today=new Date().toISOString().split('T')[0];
    s.today=true;
    if(prize.id==='points50'){ s.myPoints=(s.myPoints||0)+(prize.points||50); localStorage.setItem('guest_points', s.myPoints); if(s.user?.email) localStorage.setItem('points_'+s.user.email, s.myPoints); if(s.usersData[s.user.uid]) s.usersData[s.user.uid].points=s.myPoints; }
    if(s.user?.email) localStorage.setItem('lastSpin_'+s.user.email+'_'+today, '1');
    localStorage.setItem('guest_lastSpin_'+today, '1');
    if(s.usersData[s.user.uid]) s.usersData[s.user.uid].lastSeen=Date.now();
    const rec={uid:s.user.uid,email:s.user.email,displayName:s.user.displayName||s.user.email,prizeName:prize.name,prizeId:prize.id,timestamp:Date.now(),code:code,delivered:false, key:'local_'+Date.now(), points:prize.points||0, ip:s.ip, deviceId:s.deviceId};
    s.spins.push(rec); saveLocal();
    if(btn){ btn.textContent='✅ لعبت اليوم'; btn.disabled=true; }
  }, s.wheelSpeed*1000);
};
window.closeResult=()=>{ document.getElementById('resultModal').style.display='none'; renderApp(); };

(async()=>{
  s.deviceId=genId();
  try{ const r=await fetch('https://api.ipify.org?format=json'); const j=await r.json(); s.ip=j.ip; }catch{ s.ip='غير معروف'; }
  const saved=localStorage.getItem('currentUser');
  if(saved){ try{ s.user=JSON.parse(saved); const today=new Date().toISOString().split('T')[0]; s.today=!!localStorage.getItem('lastSpin_'+s.user.email+'_'+today); s.myPoints=parseInt(localStorage.getItem('points_'+s.user.email)||localStorage.getItem('guest_points')||'0'); if(s.user.email==='admin@ahmed.vip') s.admin=true; }catch(e){} }
  const savedWheel=localStorage.getItem('wheelData');
  if(savedWheel){ try{ const parsed=JSON.parse(savedWheel); if(parsed.length===s.prizes.length) s.prizes=parsed; }catch(e){} }
  renderApp();
})();
