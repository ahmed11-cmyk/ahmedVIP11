let audioCtx=null;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } }
function playWin(){ if(!s.soundEnabled || !audioCtx) return; try{ const now=audioCtx.currentTime; [0,0.15,0.3,0.5].forEach((d,i)=>{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.frequency.value=[523,659,784,1046][i]; g.gain.setValueAtTime(0.25, now+d); g.gain.exponentialRampToValueAtTime(0.01, now+d+0.4); o.connect(g); g.connect(audioCtx.destination); o.start(now+d); o.stop(now+d+0.4); }); }catch(e){} }
function playLose(){ if(!s.soundEnabled || !audioCtx) return; try{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.frequency.setValueAtTime(300, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(80, audioCtx.currentTime+0.5); g.gain.setValueAtTime(0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.5); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.5); }catch(e){} }

function generateDeviceId(){ let id = localStorage.getItem('ahmed_vip_device_id'); if(!id){ id = 'dev_' + Math.random().toString(36).substring(2,15) + Math.random().toString(36).substring(2,15) + '_' + Date.now(); localStorage.setItem('ahmed_vip_device_id', id); } return id; }
async function getIP(){ try{ const r=await fetch('https://api.ipify.org?format=json'); const j=await r.json(); s.ip=j.ip; return j.ip; }catch{ s.ip='unknown'; return 'unknown'; } }
function wrand(){ let t=s.prizes.reduce((a,b)=>a+b.weight,0); let r=Math.random()*t; let c=0; for(let i=0;i<s.prizes.length;i++){ c+=s.prizes[i].weight; if(r<=c) return i; } return s.prizes.length-1; }
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)]; c+='-'+Math.floor(1000+Math.random()*9000)+'-'+Date.now().toString().slice(-4); return 'VIP-'+c; }

function renderAdmin(){
  const el=document.getElementById('adminContent');
  const tabs=['dash','winners','prizes','users','security','settings'];
  tabs.forEach(t=>{ const b=document.getElementById(`tab-${t}`); if(b){ b.style.background=t===s.tab?'#fff':'rgba(255,255,255,0.05)'; b.style.color=t===s.tab?'#000':'#fff'; b.style.fontWeight=t===s.tab?'900':'400'; } });
  if(!el) return;
  if(s.tab==='dash'){
    const today=new Date().toISOString().split('T')[0]; const tToday=s.spins.filter(x=>new Date(x.timestamp).toISOString().split('T')[0]===today).length;
    el.innerHTML=`<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;"><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(255,255,255,0.06); padding:18px; border-radius:16px;"><div style="font-size:24px; font-weight:900;">${tToday}</div><div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:4px;">اليوم</div></div><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(255,255,255,0.06); padding:18px; border-radius:16px;"><div style="font-size:24px; font-weight:900; color:#fbbf24;">${s.spins.filter(x=>x.prizeName!=='حظ أوفر').length}</div><div style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:4px;">فائزين</div></div></div><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:20px; margin-bottom:20px;"><h3 style="font-weight:900; font-size:13px; margin-bottom:14px;">🔄 تحكم</h3><div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"><button onclick="window.resetAllToday()" style="background:#fbbf24; color:#000; font-weight:900; padding:14px; border-radius:9999px; font-size:12px;">صفر اليوم</button><button onclick="window.resetAllSpins()" style="background:rgba(239,68,68,0.1); color:#f87171; border:1px solid rgba(239,68,68,0.2); padding:14px; border-radius:9999px; font-size:12px;">صفر الكل</button></div></div>`;
  } else if(s.tab==='winners'){
    const winners=s.spins.filter(x=>x.prizeName!=='حظ أوفر').reverse();
    el.innerHTML=`<h3 style="font-weight:900; font-size:14px; margin-bottom:12px;">🔍 بحث كود</h3><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(255,255,255,0.06); padding:20px; border-radius:16px; margin-bottom:20px;"><div style="display:flex; gap:8px;"><input id="verifyInput" placeholder="VIP-XXXX-XXXX-XXXX" style="flex:1; background:rgba(0,0,0,0.4); border:1px solid rgba(251,191,36,0.2); border-radius:12px; padding:14px 16px; font-size:12px; font-family:monospace; font-weight:700; color:#fff;"><button onclick="window.verifyCode(document.getElementById('verifyInput').value)" style="background:#fbbf24; color:#000; font-weight:900; padding:14px 24px; border-radius:12px; font-size:12px;">🔍 بحث</button></div><div id="verifyResult" style="margin-top:16px; display:none;"></div></div><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(255,255,255,0.06); border-radius:16px; overflow:auto;"><table style="width:100%; font-size:11px;"><thead style="border-bottom:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); background:rgba(0,0,0,0.2);"><tr><th style="padding:12px; text-align:right;">المستخدم</th><th style="padding:12px;">الجائزة</th><th style="padding:12px;">الكود</th><th style="padding:12px;">بحث</th></tr></thead><tbody>${winners.map(w=>`<tr style="border-bottom:1px solid rgba(255,255,255,0.03);"><td style="padding:12px;">${w.displayName||w.email?.split('@')[0]}</td><td style="padding:12px; color:#fbbf24;">${w.prizeName}</td><td style="padding:12px;"><span style="font-family:monospace; background:#fbbf24; color:#000; padding:4px 8px; border-radius:8px; font-size:10px; font-weight:900;">${w.code||'—'}</span></td><td style="padding:12px;"><button onclick="window.searchThisCode('${w.code}')" style="background:rgba(251,191,36,0.12); color:#fbbf24; padding:6px 12px; border-radius:9999px; font-size:10px;">🔍</button></td></tr>`).join('')||'<tr><td colspan=4 style="padding:48px; text-align:center; color:rgba(255,255,255,0.2);">لا يوجد</td></tr>'}</tbody></table></div>`;
  } else if(s.tab==='prizes'){
    const total=s.prizes.reduce((a,b)=>a+Number(b.weight),0);

window.resetAllToday=async()=>{
  if(!confirm('تصفر اليوم؟')) return;
  const today=new Date().toISOString().split('T')[0];
  const snap=await get(ref(db,'spins'));
  if(!snap.val()){ alert('لا يوجد'); return; }
  let count=0; const promises=[];
  for(const [key,val] of Object.entries(snap.val())){
    if(new Date(val.timestamp).toISOString().split('T')[0]===today){
      promises.push(remove(ref(db,`spins/${key}`))); count++;
    }
  }
  await Promise.all(promises);
  alert(`✅ ${count}`); s.today=false; renderApp();
};

        if(s.bannedUsers[user.uid]|| (await get(ref(db,`banned_users/${user.uid}`))).val()){document.getElementById('app').innerHTML=`<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;"><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(239,68,68,0.2); background:rgba(239,68,68,0.05); border-radius:20px; padding:32px; text-align:center;"><h1 style="font-weight:900;">محظور</h1><p style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:8px;">تواصل مع ${TELEGRAM}</p></div></div>`;return;}
        if(s.ip && s.bannedIPs[s.ip.replace(/\./g,'_')] || (await get(ref(db,`banned_ips/${s.ip.replace(/\./g,'_')}`))).val()){document.getElementById('app').innerHTML=`<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;"><div style="background: rgba(15,23,51,0.6); border:1px solid rgba(239,68,68,0.2); background:rgba(239,68,68,0.05); border-radius:20px; padding:32px; text-align:center;"><h1 style="font-weight:900;">IP محظور</h1><p style="font-size:11px; color:rgba(255,255,255,0.4); margin-top:8px;">تواصل مع ${TELEGRAM}</p></div></div>`;return;}
        const today=new Date().toISOString().split('T')[0]; const sp=await get(ref(db,'spins')); if(sp.val()){const all=Object.values(sp.val()); const t=all.filter(x=>x.uid===user.uid && new Date(x.timestamp).toISOString().split('T')[0]===today); s.today=t.length>0; }
      }catch(e){ console.log(e); }
    }
    renderApp();
  });
})();
onValue(ref(db,'settings/maintenance'),x=>{s.maintenance=!!x.val();renderApp();});
onValue(ref(db,'settings/maintenanceMessage'),x=>{if(x.val()) s.msg=x.val();});
onValue(ref(db,'settings/telegram'),x=>{if(x.val()) s.telegram=x.val();});
onValue(ref(db,'settings/broadcast'),x=>{s.broadcast=x.val()||'';renderApp();});
onValue(ref(db,'settings/soundEnabled'),x=>{ if(x.val()!==null && x.val()!==undefined){ s.soundEnabled=!!x.val(); } else { s.soundEnabled=true; } if(s.showAdmin) renderAdmin(); else renderApp(); });
onValue(ref(db,'settings/prizes'),x=>{if(x.val()&&Array.isArray(x.val())&&x.val().length>0){s.prizes=x.val();renderApp();}});
onValue(ref(db,'spins'),x=>{ const val=x.val()||{}; const arr=Object.entries(val).map(([k,v])=>({...v, key:k})); s.spins=arr; if(s.user && !s.spinning){ const today=new Date().toISOString().split('T')[0]; const t=arr.filter(v=>v.uid===s.user.uid && new Date(v.timestamp).toISOString().split('T')[0]===today); const was=s.today; s.today=t.length>0; if(was!==s.today && !s.spinning){ renderApp(); } } if(s.showAdmin) renderAdmin(); });
onValue(ref(db,'users'),x=>{s.users=x.val()?Object.values(x.val()):[]; if(s.showAdmin) renderAdmin();});
onValue(ref(db,'banned_ips'),x=>{s.bannedIPs=x.val()||{}; if(s.showAdmin) renderAdmin();});
onValue(ref(db,'banned_users'),x=>{s.bannedUsers=x.val()||{}; if(s.showAdmin) renderAdmin();});
renderApp();
</script>
