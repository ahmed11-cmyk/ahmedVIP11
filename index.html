<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eFootball & Hotel Hub</title>
<style>
:root{--bg:#0b1020;--card:#151d33;--accent:#00e0b0;--gold:#ffc83d;--text:#eef2ff;--muted:#8a94b8;--danger:#ff4d6d}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--accent);color:#06121a;font-size:14px}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:1px solid #2a3558}
button.danger{background:var(--danger);color:#fff}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #2a3558;background:#0e1528;color:var(--text);margin:4px 0;font-size:14px;font-family:inherit}
label{display:block;font-size:13px;color:var(--muted)}
.wrap{max-width:960px;margin:auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{background:linear-gradient(160deg,#1e2a52,#0e1528);border:2px solid var(--gold);border-radius:14px;padding:12px;text-align:center}
.pcard img{width:100%;border-radius:10px;aspect-ratio:3/4;object-fit:cover}
.ph{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:48px;background:#0b1020;border-radius:10px}
.ovr{font-size:26px;font-weight:900;color:var(--gold);margin-top:6px}
.muted{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.line{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #22304f;padding:6px 0;flex-wrap:wrap}
#wheelWrap{position:relative;width:300px;max-width:100%;margin:auto}
#wheel{width:100%;height:auto}
#pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--gold);z-index:2}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:8px;border-bottom:1px solid #22304f;text-align:right}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222c4d;padding:12px 18px;border-radius:12px;z-index:99;display:none;max-width:90%;text-align:center}
</style>
</head>

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const fns = firebase.app().functions(REGION);

let user = null, profile = {};
let wheelItems = [], storeItems = [], rooms = [], allUsers = [], allBookings = [], myBookings = [];

const v = id => $(id).value.trim();

const isAdmin = () => !!user && (user.email || "").toLowerCase() === ADMIN_EMAIL.toLowerCase();

function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000);
}

// كل العمليات الحساسة تمر من هنا
async function call(name, data = {}, quiet = false) {
  try {
    const res = await fns.httpsCallable(name)(data);
    if (!quiet && res.data?.msg) toast(res.data.msg);
    return res.data;
  } catch (e) {
    toast(e.message || "صار خطأ");
    throw e;
  }
}

// ================== تسجيل الدخول ==================
function errMsg(e) {
  const m = {
    "auth/email-already-in-use": "الإيميل مسجل مسبقاً",
    "auth/invalid-email": "الإيميل غير صحيح",
    "auth/weak-password": "الرمز ضعيف (6 أحرف على الأقل)",
    "auth/wrong-password": "الرمز غلط",
    "auth/invalid-credential": "الإيميل أو الرمز غلط",
    "auth/user-not-found": "الحساب غير موجود",
    "auth/too-many-requests": "محاولات كثيرة، انتظر شوي"
  };
  return m[e.code] || e.message;
}
function login() { auth.signInWithEmailAndPassword(v("email"), $("pass").value).catch(e => toast(errMsg(e))); }
async function register() {

    const cred = await auth.createUserWithEmailAndPassword(v("email"), $("pass").value);
    await cred.user.sendEmailVerification();
    toast("أرسلنا رابط التفعيل لإيميلك");

}
function googleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e => toast(errMsg(e))); }
function resendVerify() { if (auth.currentUser) auth.currentUser.sendEmailVerification().then(() => toast("تم الإرسال")); }
function logout() { auth.signOut(); }

function showScreen(id) {
  ["v-auth", "v-verify", "app"].forEach(x => show(x, x === id));
}

auth.onAuthStateChanged(u => {
  unsubs.forEach(f => f()); unsubs = [];
  user = u;

  if (!u) return showScreen("v-auth");
  if (!u.emailVerified) return showScreen("v-verify");
  showScreen("app");

  call("initUser", {}, true).catch(() => {});

  unsubs.push(db.collection("users").doc(u.uid).onSnapshot(d => {

  unsubs.push(db.collection("wheel").onSnapshot(s => {

  unsubs.push(db.collection("store").onSnapshot(s => {

// ================== التنقل ==================
function go(name) {
  document.querySelectorAll(".view").forEach(s => {
    if (s.id.startsWith("v-")) show(s.id, s.id === "v-" + name);
  });
  document.querySelectorAll(".nav").forEach(b => b.classList.toggle("ghost", b.dataset.go !== name));

}

// ================== eFootball: العرض ==================
function cooldownLeft() {
  const last = profile.lastSpinAt?.toDate ? profile.lastSpinAt.toDate().getTime() : 0;
  return last ? Math.max(0, SPIN_COOLDOWN_MS - (Date.now() - last)) : 0;
}
function renderProfile() {
  $("coins").textContent = profile.coins || 0;
  const left = cooldownLeft();
  $("spinBtn").disabled = spinning || left > 0;
  $("spinMsg").textContent = left > 0
    ? `ترجع اللفة بعد ${Math.floor(left / 3600000)} ساعة و ${Math.floor((left % 3600000) / 60000)} دقيقة`
    : "عندك لفة متاحة 🎉";
}
setInterval(() => { if (user) renderProfile(); }, 30000);

function playerCard(p, extra = "") {
  const img = p.image ? `<img src="${esc(p.image)}" alt="">` : `<div class="ph">⚽</div>`;
  return `<div class="pcard">${img}<div class="ovr">${esc(p.rating ?? "")} <span class="muted" style="font-size:14px">${esc(p.pos || "")}</span></div><div style="font-weight:700">${esc(p.name)}</div>${extra}</div>`;
}
function renderStore() {
  $("storeGrid").innerHTML = storeItems.map(p => {
    const owned = (profile.inventory || []).includes(p.id);
    const btn = owned
      ? `<div class="muted" style="margin-top:8px">عندك ✅</div>`
      : `<div style="margin-top:8px"><button onclick="buy('${p.id}')">شراء ${p.price || 500} 🪙</button></div>`;
    return playerCard(p, btn);
  }).join("") || `<p class="muted">المتجر فاضي</p>`;
}
function renderInventory() {
  const items = (profile.inventory || []).map(id => storeItems.find(p => p.id === id)).filter(Boolean);
  $("invGrid").innerHTML = items.map(p => playerCard(p)).join("");
  $("invEmpty").textContent = items.length ? "" : "ما عندك لاعبين لحد الحين";
}
async function buy(id) { try { await call("buyPlayer", { playerId: id }); } catch (e) {} }

// ================== العجلة ==================
function drawWheel() {
  const c = $("wheel"), ctx = c.getContext("2d");
  const R = c.width / 2;
  ctx.clearRect(0, 0, c.width, c.height);
  const items = wheelItems.filter(i => Number(i.weight) > 0);
  ctx.save(); ctx.translate(R, R); ctx.rotate(angle);
  if (!items.length) {
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(0, 0, R - 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); return;
  }
  const total = items.reduce((s, i) => s + Number(i.weight), 0);
  let start = 0;
  items.forEach(it => {
    const a = (Number(it.weight) / total) * Math.PI * 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R - 4, start, start + a);
    ctx.fillStyle = it.color || "#334"; ctx.fill();
    ctx.save(); ctx.rotate(start + a / 2);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
    ctx.fillText(String(it.label).slice(0, 16), R - 20, 5);
    ctx.restore();
    start += a;
  });
  ctx.restore();
}

// حركة فقط، النتيجة جاية من السيرفر
function animateTo(idx, items) {
  return new Promise(res => {
    const total = items.reduce((s, i) => s + Number(i.weight), 0);
    let s = 0;
    for (let k = 0; k < idx; k++) s += (Number(items[k].weight) / total) * Math.PI * 2;
    const a = (Number(items[idx].weight) / total) * Math.PI * 2;
    const center = s + a / 2;
    const start = angle;
    const delta = ((-Math.PI / 2 - center - start) % (2 * Math.PI) + 4 * Math.PI) % (2 * Math.PI);
    const end = start + 5 * 2 * Math.PI + delta;
    const t0 = performance.now(), dur = 4000;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      angle = start + (end - start) * (1 - Math.pow(1 - t, 3));
      drawWheel();
      t < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}

async function spin() {
  if (spinning) return;
  if (cooldownLeft() > 0) return toast("تقدر تلف مرة وحدة كل 24 ساعة");
  spinning = true; renderProfile();
  let res;
  try { res = await call("spin", {}, true); }
  catch (e) { spinning = false; renderProfile(); return; }

  const items = wheelItems.filter(i => Number(i.weight) > 0);
  const idx = items.findIndex(i => i.id === res.itemId);
  if (idx >= 0) await animateTo(idx, items);
  spinning = false; renderProfile();
  toast(res.msg);
}

// ================== أدمن: العجلة ==================
function toggleWType() {
  const isPlayer = $("wType").value === "player";
  show("wPlayer", isPlayer); show("wAmount", !isPlayer);
}
function renderAdminWheel() {
  if (!isAdmin()) return;
  const total = wheelItems.reduce((s, i) => s + (Number(i.weight) || 0), 0);
  $("wheelTotal").textContent = "مجموع الأوزان: " + total;
  $("wheelAdmin").innerHTML = wheelItems.map(i => `
    <div class="line">
      <span style="flex:1">${esc(i.label)} <span class="muted">(${total ? ((i.weight / total) * 100).toFixed(1) : 0}%)</span></span>
      <input type="number" value="${i.weight}" style="width:90px;margin:0" onchange="updWheelWeight('${i.id}', this.value)">
      <button class="ghost" onclick="editWheel('${i.id}')">تعديل</button>
      <button class="danger" onclick="deleteWheel('${i.id}')">حذف</button>
    </div>`).join("") || `<p class="muted">ما فيه عناصر</p>`;
}
function renderAdminPlayerOptions() {
  if (!isAdmin()) return;
  const cur = $("wPlayer").value;
  $("wPlayer").innerHTML = storeItems.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  if (cur) $("wPlayer").value = cur;
  const curG = $("upGrantSel").value;
  $("upGrantSel").innerHTML = storeItems.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
  if (curG) $("upGrantSel").value = curG;
}
function resetWheelForm() {
  wEditId = null;
  $("wFormTitle").textContent = "إضافة عنصر";
  $("wSaveBtn").textContent = "إضافة للعجلة";
  $("wLabel").value = ""; $("wWeight").value = ""; $("wAmount").value = "50";
  $("wType").value = "coins"; toggleWType();
}
function editWheel(id) {
  const i = wheelItems.find(x => x.id === id); if (!i) return;
  wEditId = id;
  $("wFormTitle").textContent = "تعديل عنصر";
  $("wSaveBtn").textContent = "حفظ التعديل";
  $("wType").value = i.type || "coins"; toggleWType();
  $("wLabel").value = i.label || "";
  $("wAmount").value = i.amount ?? 0;
  $("wWeight").value = i.weight ?? "";
  $("wColor").value = i.color || "#3a4a8a";
  if (i.type === "player" && i.playerId) $("wPlayer").value = i.playerId;
  $("wLabel").scrollIntoView({ behavior: "smooth", block: "center" });
}
async function saveWheelForm() {
  try {
    await call("saveWheelItem", {
      id: wEditId || undefined,
      label: v("wLabel"),
      type: v("wType"),
      weight: Number(v("wWeight")),
      amount: Number(v("wAmount")) || 0,
      playerId: $("wPlayer").value,
      color: $("wColor").value
    });
    resetWheelForm();
  } catch (e) {}
}
async function updWheelWeight(id, weight) {
  const item = wheelItems.find(x => x.id === id);
  if (!item) return;
  try { await call("saveWheelItem", { ...item, weight: Number(weight) }, true); toast("تم تحديث الوزن ✅"); } catch (e) {}
}
async function deleteWheel(id) {
  if (!confirm("متأكد تبي تحذف؟")) return;
  try { await call("deleteWheelItem", { id }); } catch (e) {}
}

// ================== أدمن: المتجر ==================
function renderAdminStore() {
  if (!isAdmin()) return;
  $("storeAdmin").innerHTML = storeItems.map(p => `
    <div class="line">
      <span style="flex:1">${esc(p.name)} (${esc(p.rating ?? "")} ${esc(p.pos || "")})</span>
      <input type="number" value="${p.price || 500}" style="width:100px;margin:0" onchange="updStorePrice('${p.id}', this.value)">
      <button class="ghost" onclick="editStore('${p.id}')">تعديل</button>
      <button class="danger" onclick="deleteStore('${p.id}')">حذف</button>
    </div>`).join("") || `<p class="muted">ما فيه لاعبين</p>`;
}
function resetStoreForm() {
  sEditId = null;
  $("sFormTitle").textContent = "إضافة لاعب";
  $("sSaveBtn").textContent = "إضافة للمتجر";
  ["sName", "sRating", "sPos", "sImg"].forEach(i => $(i).value = "");
  $("sPrice").value = "500";
}
function editStore(id) {
  const p = storeItems.find(x => x.id === id); if (!p) return;
  sEditId = id;
  $("sFormTitle").textContent = "تعديل لاعب";
  $("sSaveBtn").textContent = "حفظ التعديل";
  $("sName").value = p.name || "";
  $("sRating").value = p.rating ?? "";
  $("sPos").value = p.pos || "";
  $("sPrice").value = p.price ?? 500;
  $("sImg").value = p.image || "";
  $("sName").scrollIntoView({ behavior: "smooth", block: "center" });
}
async function saveStoreForm() {
  try {
    await call("saveStorePlayer", {
      id: sEditId || undefined,
      name: v("sName"),
      rating: Number(v("sRating")) || 0,
      pos: v("sPos"),
      price: Number(v("sPrice")) || 500,
      image: v("sImg")
    });
    resetStoreForm();
  } catch (e) {}
}
async function updStorePrice(id, price) {
  const p = storeItems.find(x => x.id === id);
  if (!p) return;
  try { await call("saveStorePlayer", { ...p, price: Number(price) }, true); toast("تم تحديث السعر ✅"); } catch (e) {}
}
async function deleteStore(id) {
  if (!confirm("يحذف اللاعب من المتجر وعناصره من العجلة. متأكد؟")) return;
  try { await call("deleteStorePlayer", { id }); } catch (e) {}
}

// ================== أدمن: المستخدمين ==================
function renderAdminUsers() {
  if (!isAdmin()) return;
  $("usersAdmin").innerHTML = `<table><tr><th>الإيميل</th><th>كوينز</th><th>لاعبين</th><th></th></tr>` +
    allUsers.map(u => `<tr>
      <td>${esc(u.email || u.id)}</td><td>${u.coins || 0}</td><td>${(u.inventory || []).length}</td>
      <td><button class="ghost" onclick="openUser('${u.id}')">إدارة</button></td>
    </tr>`).join("") + `</table>`;
}
function openUser(uid) { currentUid = uid; show("userPanel", true); renderUserPanel(); }
function upClose() { currentUid = null; show("userPanel", false); }
function renderUserPanel() {
  if (!isAdmin() || !currentUid) return;
  const u = allUsers.find(x => x.id === currentUid);
  if (!u) return upClose();
  $("upTitle").textContent = "إدارة: " + (u.email || u.id);
  if (document.activeElement !== $("upCoins")) $("upCoins").value = u.coins || 0;
  const inv = u.inventory || [];
  $("upInv").innerHTML = inv.map(id => {
    const p = storeItems.find(x => x.id === id);
    return `<div class="line"><span style="flex:1">${esc(p ? p.name : id)}</span>
      <button class="danger" onclick="upRevoke('${id}')">سحب</button></div>`;
  }).join("") || `<p class="muted">ما عنده لاعبين</p>`;
}
async function upSaveCoins() {
  try { await call("setUserCoins", { uid: currentUid, coins: Number($("upCoins").value) }); } catch (e) {}
}
async function upResetSpin() { try { await call("resetSpin", { uid: currentUid }); } catch (e) {} }
async function upGrant() {
  try { await call("grantPlayer", { uid: currentUid, playerId: $("upGrantSel").value }); } catch (e) {}
}
async function upRevoke(playerId) {
  try { await call("revokePlayer", { uid: currentUid, playerId }); } catch (e) {}
}

// ================== الفندق: الغرف والحجز ==================
function nightsSel() {
  const a = $("ciIn").value, b = $("ciOut").value;
  if (!a || !b) return 0;
  return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
}
function renderRooms() {
  const n = nightsSel();
  $("hint").textContent = n > 0 ? `عدد الليالي: ${n}` : "اختار تاريخ الوصول والمغادرة";
  $("roomsGrid").innerHTML = rooms.map(r => {
    const price = n > 0 ? ` (المجموع ${n * (Number(r.pricePerNight) || 0)})` : "";
    const img = r.image ? `<img src="${esc(r.image)}" alt="">` : `<div class="ph">🛏️</div>`;
    const btn = n > 0
      ? `<div style="margin-top:8px"><button onclick="book('${r.id}')">احجز</button></div>`
      : "";
    return `<div class="pcard">${img}
      <div class="ovr">${esc(r.pricePerNight)} <span class="muted" style="font-size:14px">/ ليلة</span></div>
      <div style="font-weight:700">${esc(r.name)}</div>
      <div class="muted">سعة ${esc(r.capacity)} · ${esc(r.description || "")}${price}</div>${btn}</div>`;
  }).join("") || `<p class="muted">ما فيه غرف لحد الحين</p>`;
}
async function book(roomId) {
  try {
    await call("createBooking", { roomId, checkIn: $("ciIn").value, checkOut: $("ciOut").value });
  } catch (e) {}
}
function renderMyBookings() {
  $("myBookings").innerHTML = myBookings.slice().reverse().map(b => `
    <div class="card line">
      <div style="flex:1"><b>${esc(b.roomName)}</b><div class="muted">${esc(b.checkIn)} ← ${esc(b.checkOut)} · ${b.nights} ليلة · ${b.total}</div></div>
      <span class="muted">${b.status === "confirmed" ? "مؤكد" : "ملغي"}</span>
      ${b.status === "confirmed" ? `<button class="danger" onclick="cancelBk('${b.id}')">إلغاء</button>` : ""}
    </div>`).join("") || `<p class="muted">ما عندك حجوزات</p>`;
}
async function cancelBk(id) {
  if (!confirm("متأكد تبي تلغي الحجز؟")) return;
  try { await call("cancelBooking", { id }); } catch (e) {}
}

// ================== أدمن: الغرف والحجوزات ==================
function resetRoomForm() {
  rEditId = null;
  $("rFormTitle").textContent = "إضافة غرفة";
  $("rSaveBtn").textContent = "إضافة الغرفة";
  $("rName").value = ""; $("rPrice").value = "300"; $("rCap").value = "2";
  $("rDesc").value = ""; $("rImg").value = "";
}
function renderAdminRooms() {
  if (!isAdmin()) return;
  $("roomAdmin").innerHTML = rooms.map(r => `
    <div class="line">
      <span style="flex:1">${esc(r.name)} (${esc(r.pricePerNight)} / ليلة · سعة ${esc(r.capacity)})</span>
      <button class="ghost" onclick="editRoom('${r.id}')">تعديل</button>
      <button class="danger" onclick="deleteRoom('${r.id}')">حذف</button>
    </div>`).join("") || `<p class="muted">ما فيه غرف</p>`;
}
function editRoom(id) {
  const r = rooms.find(x => x.id === id); if (!r) return;
  rEditId = id;
  $("rFormTitle").textContent = "تعديل غرفة";
  $("rSaveBtn").textContent = "حفظ التعديل";
  $("rName").value = r.name || "";
  $("rPrice").value = r.pricePerNight ?? 0;
  $("rCap").value = r.capacity ?? 2;
  $("rDesc").value = r.description || "";
  $("rImg").value = r.image || "";
}
async function saveRoomForm() {
  try {
    await call("saveRoom", {
      id: rEditId || undefined,
      name: v("rName"),
      pricePerNight: Number($("rPrice").value),
      capacity: Number($("rCap").value),
      description: $("rDesc").value.trim(),
      image: v("rImg")
    });
    resetRoomForm();
  } catch (e) {}
}
async function deleteRoom(id) {
  if (!confirm("متأكد تبي تحذف الغرفة؟")) return;
  try { await call("deleteRoom", { id }); } catch (e) {}
}
function renderAdminBookings() {
  if (!isAdmin()) return;
  const confirmed = allBookings.filter(b => b.status === "confirmed");
  const revenue = confirmed.reduce((s, b) => s + (Number(b.total) || 0), 0);
  $("statsLine").textContent = `حجوزات مؤكدة: ${confirmed.length} · الإيرادات: ${revenue}`;
  $("bookingsAdmin").innerHTML = `<table><tr><th>الغرفة</th><th>الإيميل</th><th>من</th><th>إلى</th><th>المجموع</th><th></th></tr>` +
    allBookings.slice().reverse().map(b => `<tr>
      <td>${esc(b.roomName)}</td><td>${esc(b.email)}</td><td>${esc(b.checkIn)}</td><td>${esc(b.checkOut)}</td>
      <td>${b.total}</td>
      <td>${b.status === "confirmed" ? `<button class="danger" onclick="cancelBk('${b.id}')">إلغاء</button>` : "ملغي"}</td>
    </tr>`).join("") + `</table>`;
}

// ================== تهيئة ==================
async function seed() {
  try { await call("seed"); } catch (e) {}
}
</script>
