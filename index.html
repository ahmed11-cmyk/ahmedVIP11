    o.frequency.setValueAtTime(300, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(80, audioCtx.currentTime+0.5);
    g.gain.setValueAtTime(0.12, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.5);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.5);
  }catch(e){}
}

function wrand(){ let t=s.prizes.reduce((a,b)=>a+b.weight,0); let r=Math.random()*t; let c=0; for(let i=0;i<s.prizes.length;i++){ c+=s.prizes[i].weight; if(r<=c) return i; } return s.prizes.length-1; }
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)]; c+='-'+Math.floor(1000+Math.random()*9000)+'-'+Date.now().toString().slice(-4); return 'VIP-'+c; }

window.toggleAdmin=()=>{s.showAdmin=!s.showAdmin; const p=document.getElementById('adminPanel'); if(p){ p.style.display=s.showAdmin?'flex':'none'; } if(s.showAdmin) renderAdmin();};
window.setTab=(t)=>{s.tab=t; renderAdmin();};
window.resetAllToday=async()=>{
  if(!confirm('تصفر محاولات اليوم؟')) return;
  const today=new Date().toISOString().split('T')[0];
  const snap=await get(ref(db,'spins'));
  if(!snap.val()){ alert('لا يوجد'); return; }
  let count=0; const promises=[];
  for(const [key,val] of Object.entries(snap.val())){
    if(new Date(val.timestamp).toISOString().split('T')[0]===today){
      promises.push(remove(ref(db,`spins/${key}`))); count++;
    }
  }
  await Promise.all(promises);
  alert(`✅ تم تصفير ${count}`); s.today=false; renderApp();
};
window.resetUserAttempts=async(uid)=>{
  if(!confirm('تصفر؟')) return;
  const today=new Date().toISOString().split('T')[0];
  const snap=await get(ref(db,'spins'));
  let count=0; const promises=[];
  for(const [key,val] of Object.entries(snap.val()||{})){
    if(val.uid===uid && new Date(val.timestamp).toISOString().split('T')[0]===today){
      promises.push(remove(ref(db,`spins/${key}`))); count++;
    }
  }
  await Promise.all(promises);
  alert(`✅ ${count}`);
};
window.resetAllSpins=async()=>{
  if(!confirm('تصفر الكل؟')) return;
  if(!confirm('تأكيد ثاني؟')) return;
  await remove(ref(db,'spins')); alert('تم حذف الكل'); s.today=false; renderApp();
};
window.updatePrize=(i,k,v)=>{if(k==='weight') v=parseFloat(v)||0; s.prizes[i][k]=v; renderAdmin();};
window.updatePrizeWeight=(i,v)=>{ v=parseFloat(v)||0; s.prizes[i].weight=v; clearTimeout(window._timer); window._timer=setTimeout(()=>{ renderAdmin(); }, 300); };
window.savePrizes=async()=>{
  const total=s.prizes.reduce((a,b)=>a+Number(b.weight),0);
  if(Math.abs(total-100)>0.5){ if(!confirm(`المجموع ${total.toFixed(1)}% مو 100% - تحفظ؟`)) return; }
  try{await set(ref(db,'settings/prizes'),s.prizes); alert(`✅ تم حفظ ${total.toFixed(1)}%`);}catch(e){alert(e.message);}};

window.copyCode=(code)=>{ navigator.clipboard.writeText(code).then(()=>{ alert(`✅ تم نسخ: ${code}`); }).catch(()=>{ prompt('انسخ:', code); }); };
window.markDelivered=async(key)=>{ if(!key) return; try{ await update(ref(db,`spins/${key}`),{delivered:true, deliveredAt:Date.now(), deliveredBy:s.user?.email}); alert('✅ تم'); }catch(e){ alert(e.message); } };

window.closeResult=()=>{ const m=document.getElementById('resultModal'); if(m){ m.style.display='none'; } renderApp(); };
let taps=[]; document.addEventListener('click',e=>{const logo=e.target.closest('#logo'); if(logo){const now=Date.now(); taps=taps.filter(t=>now-t<3000); taps.push(now); if(taps.length>=5){taps=[]; if(s.admin){window.toggleAdmin();} else {const code=prompt('كود الأدمن:'); if(code==='AHMED2026'&&s.user){set(ref(db,`admins/${s.user.uid}`),{email:s.user.email,role:'admin'}).then(()=>{s.admin=true; renderApp();});}}}}});
(async()=>{
  await getIP();
  onAuthStateChanged(auth, async(user)=>{
    s.user=user;
    if(user){
      s.guest=false;
      try{
        const adminSnap=await get(ref(db,`admins/${user.uid}`));
        s.admin=!!adminSnap.val() || user.email===SPECIAL_ADMIN;
        const banSnap=await get(ref(db,`banned_users/${user.uid}`));
        if(banSnap.val()){document.getElementById('app').innerHTML=`<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;"><div class="card" style="border-radius:20px; padding:32px; text-align:center;"><h1 style="font-weight:900;">محظور</h1></div></div>`;return;}
        if(s.ip){ const ipBan=await get(ref(db,`banned_ips/${s.ip.replace(/\./g,'_')}`)); if(ipBan.val()){document.getElementById('app').innerHTML=`<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;"><div class="card" style="border-radius:20px; padding:32px; text-align:center;"><h1 style="font-weight:900;">IP محظور</h1></div></div>`;return;} }
        const today=new Date().toISOString().split('T')[0]; const sp=await get(ref(db,'spins')); if(sp.val()){const all=Object.values(sp.val()); const t=all.filter(x=>x.uid===user.uid && new Date(x.timestamp).toISOString().split('T')[0]===today); s.today=t.length>0; }
      }catch(e){ console.log(e); }
    }
    renderApp();
  });
})();
onValue(ref(db,'settings/maintenance'),x=>{s.maintenance=!!x.val();renderApp();});
onValue(ref(db,'settings/telegram'),x=>{if(x.val()) s.telegram=x.val();});
onValue(ref(db,'settings/broadcast'),x=>{s.broadcast=x.val()||'';renderApp();});
onValue(ref(db,'settings/soundEnabled'),x=>{ if(x.val()!==null && x.val()!==undefined){ s.soundEnabled=!!x.val(); } else { s.soundEnabled=true; } if(s.showAdmin) renderAdmin(); else renderApp(); });
onValue(ref(db,'settings/prizes'),x=>{if(x.val()&&Array.isArray(x.val())&&x.val().length>0){s.prizes=x.val();renderApp();}});
onValue(ref(db,'spins'),x=>{
  const val=x.val()||{};
  const arr=Object.entries(val).map(([k,v])=>({...v, key:k}));
  s.spins=arr;
  if(s.user && !s.spinning){
    const today=new Date().toISOString().split('T')[0];
    const t=arr.filter(v=>v.uid===s.user.uid && new Date(v.timestamp).toISOString().split('T')[0]===today);
    const was=s.today;
    s.today=t.length>0;
    if(was!==s.today && !s.spinning){ renderApp(); }
  }
  if(s.showAdmin) renderAdmin();
});
onValue(ref(db,'users'),x=>{s.users=x.val()?Object.values(x.val()):[]; if(s.showAdmin) renderAdmin();});
