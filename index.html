function genId(){ let id=localStorage.getItem('ahmed_vip_device_id'); if(!id){ id='dev_'+Math.random().toString(36).substring(2,15)+Date.now(); localStorage.setItem('ahmed_vip_device_id',id);} return id; }
function wrand(){ const visible = s.prizes.filter(p=>p.visible!==false); let t=visible.reduce((a,b)=>a+b.weight,0); let r=Math.random()*t; let c=0; for(let i=0;i<s.prizes.length;i++){ if(s.prizes[i].visible===false) continue; c+=s.prizes[i].weight; if(r<=c) return i; } return s.prizes.length-1; }
function genCode(){ const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=chars[Math.floor(Math.random()*chars.length)]; c+='-'+Math.floor(1000+Math.random()*9000)+'-'+Date.now().toString().slice(-4); return 'VIP-'+c; }

  try{
    localStorage.setItem('local_spins', JSON.stringify(s.spins.slice(-300)));

function getAllUsers(){
  const map={};
  for(let i=0;i<s.spins.length;i++){
    const sp=s.spins[i];
    if(!map[sp.uid]) map[sp.uid]={uid:sp.uid, email:sp.email||'guest', displayName:sp.displayName||sp.email||'مستخدم', ip:sp.ip||'?', totalSpins:0, wins:0, points:0, lastSeen:sp.timestamp, codes:[]};
    map[sp.uid].totalSpins++;
    if(sp.prizeName!=='حظ أوفر') map[sp.uid].wins++;
    if(sp.timestamp>map[sp.uid].lastSeen) map[sp.uid].lastSeen=sp.timestamp;
    map[sp.uid].codes.push(sp.code);
  }
  const keys=Object.keys(s.usersData);
  for(let i=0;i<keys.length;i++){
    const uid=keys[i]; const d=s.usersData[uid];
    if(!map[uid]) map[uid]={uid, email:d.email||uid, displayName:d.displayName||d.email||'مستخدم', ip:d.ip||'?', totalSpins:0, wins:0, points:d.points||0, lastSeen:d.lastSeen||Date.now(), codes:[]};
    else { map[uid].points=d.points||map[uid].points; map[uid].displayName=d.displayName||map[uid].displayName; }
  }
  if(s.user && !map[s.user.uid]) map[s.user.uid]={uid:s.user.uid, email:s.user.email, displayName:s.user.displayName||s.user.email, ip:s.ip||'حالي', totalSpins:s.spins.filter(x=>x.uid===s.user.uid).length, wins:0, points:s.myPoints, lastSeen:Date.now(), codes:[]};
  const arr=Object.values(map);
  arr.sort((a,b)=>b.lastSeen-a.lastSeen);
  return arr;
}

    return;

window.setMode=(m)=>{ s.login=m; renderApp(); };
window.asGuest=()=>{ s.guest=true; s.user={uid:'guest_'+Date.now(), email:'guest@ahmed.vip', displayName:'ضيف', photoURL:''}; s.myPoints=parseInt(localStorage.getItem('guest_points')||'0'); renderApp(); };
window.authEmail=()=>{
  const email=document.getElementById('email')?.value.trim(); const pass=document.getElementById('password')?.value; const name=document.getElementById('displayName')?.value||email.split('@')[0];
  const err=document.getElementById('err');
  if(!email||!pass){ if(err){ err.textContent='أدخل البيانات'; err.style.display='block'; } return; }
  s.user={uid:'local_'+Date.now(), email:email, displayName:name, photoURL:''};
  s.isAdmin = email.toLowerCase() === 'admin@ahmed.vip';
  s.myPoints=parseInt(localStorage.getItem('points_'+email)||'0');
  localStorage.setItem('currentUser', JSON.stringify(s.user));
  localStorage.setItem('isAdmin', s.isAdmin);
  s.usersData[s.user.uid]={email:email, displayName:name, points:s.myPoints, ip:s.ip, deviceId:s.deviceId, lastSeen:Date.now()};
  saveLocal();
  if(err){ err.style.display='block'; err.style.background='rgba(34,197,94,0.08)'; err.style.color='#86efac'; err.textContent= s.isAdmin ? '✅ دخلت admin@ahmed.vip - كل الأقسام شغالة' : '✅ دخلت'; }
  setTimeout(()=>{ renderApp(); if(s.isAdmin){ setTimeout(()=>{ window.toggleAdmin(); }, 400); } }, 300);
};
window.handleLogout=()=>{ s.guest=false; s.user=null; s.isAdmin=false; localStorage.removeItem('currentUser'); localStorage.removeItem('isAdmin'); renderApp(); };
window.toggleProfile=()=>{ s.showProfile=!s.showProfile; renderApp(); };
window.toggleAdmin=()=>{ if(!s.isAdmin || s.user?.email?.toLowerCase() !== 'admin@ahmed.vip'){ return; } s.showAdmin=!s.showAdmin; document.getElementById('adminPanel').style.display=s.showAdmin?'flex':'none'; if(s.showAdmin) { s.tab='dash'; renderAdmin(); } };
window.toggleStore=()=>{ s.showStore=!s.showStore; document.getElementById('storeModal').style.display=s.showStore?'flex':'none'; if(s.showStore) renderStore(); };
window.setTab=(t)=>{ s.tab=t; renderAdmin(); };
window.filterUsers=()=>{
  const q=document.getElementById('userSearch')?.value.toLowerCase()||'';
  const cards=document.querySelectorAll('#usersList .feature-card-pro');
  for(let i=0;i<cards.length;i++){
    const email=cards[i].getAttribute('data-email')?.toLowerCase()||'';
    const ip=cards[i].getAttribute('data-ip')?.toLowerCase()||'';
    cards[i].style.display= (!q || email.includes(q) || ip.includes(q)) ? 'block' : 'none';
  }

window.spin=()=>{
  if(s.today){ alert('لعبت اليوم'); return; }
  if(s.spinning) return;
  s.spinning=true; const btn=document.getElementById('spinBtn'); if(btn){ btn.disabled=true; btn.textContent='⏳ جاري...'; }
  const idx=wrand(); const prize=s.prizes[idx]; const ang=360/s.prizes.length; const center=idx*ang+ang/2; const toTop=(360-center+360)%360; const target=360*10+toTop; s.rot=(s.rot+target)%3600;

    if(modal) modal.style.display='flex';
    const today=new Date().toISOString().split('T')[0];

    if(s.user?.email) localStorage.setItem('lastSpin_'+s.user.email+'_'+today, '1');

    s.spins.push(rec); saveLocal();
    if(btn){ btn.textContent='✅ لعبت اليوم'; btn.disabled=true; }
  }, s.wheelSpeed*1000);
};
