let audioCtx=null; let tickTimer=null; let tickDelay=60;
function initAudio(){ if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} } }
function playRealisticTick(){
  if(!s.soundEnabled || !audioCtx) return;
  try{
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    const filter=audioCtx.createBiquadFilter();
    osc.type='square';
    osc.frequency.value=1200 + Math.random()*200;
    filter.type='highpass';
    filter.frequency.value=800;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.08);
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime+0.08);
  }catch(e){}
}
function startTickingSound(){

  if(tickTimer) clearInterval(tickTimer);

    playRealisticTick();

    } else {
      clearInterval(tickTimer);
      tickTimer=setInterval(()=>{
        playRealisticTick();
        tickDelay+=10;
        if(tickDelay>320){ clearInterval(tickTimer); tickTimer=null; }
      }, tickDelay);
    }
  }, tickDelay);
}
function stopTickingSound(){ if(tickTimer){ clearInterval(tickTimer); tickTimer=null; } }
function playWinSound(){
  if(!s.soundEnabled || !audioCtx) return;
  try{
    const playNote=(freq, delay, dur, vol)=>{
      setTimeout(()=>{
        const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
        o.frequency.value=freq; g.gain.setValueAtTime(vol, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+dur);
      }, delay);
    };
    playNote(523, 0, 0.3, 0.25); // C5
    playNote(659, 150, 0.3, 0.25); // E5
    playNote(784, 300, 0.5, 0.3); // G5
    playNote(1046, 500, 0.8, 0.35); // C6
  }catch(e){}
}
function playLoseSound(){
  if(!s.soundEnabled || !audioCtx) return;
  try{
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.frequency.setValueAtTime(400, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(100, audioCtx.currentTime+0.6);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.6);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.6);
  }catch(e){}
}
