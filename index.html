<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الجاسوس VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>*{font-family:Cairo}body{background:#06080f;color:#fff}.glass{background:rgba(255,255,255,.06);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}.gold-gradient{background:linear-gradient(135deg,#FFD700 0%,#FFA500 100%)}</style>
</head>
<body>
<header class="flex justify-between p-4 glass sticky top-0 z-20">
<div class="flex gap-3 items-center"><div class="w-12 h-12 gold-gradient rounded-xl flex items-center justify-center text-black font-black">🕵️</div><h1 class="font-black text-xl">الجاسوس <span class="text-yellow-400">VIP</span></h1></div>
<div class="flex gap-2"><span id="userBadge" class="hidden glass px-3 py-1 rounded-full text-xs"></span><button id="adminBtn" class="hidden glass px-4 py-2 rounded-full text-xs">لوحة التحكم 👑</button><button id="logoutBtn" class="hidden bg-red-500/20 px-4 py-2 rounded-full text-xs">خروج</button></div>
</header>
<main id="app" class="p-4 md:p-8 max-w-7xl mx-auto"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendEmailVerification,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getDatabase,ref,set,get,onValue,off,remove,update,push} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyDhp-hVKq-Sb6i4dLtthcvDg8Fsvya9Vv8",authDomain:"ahmed-vip-portal.firebaseapp.com",databaseURL:"https://ahmed-vip-portal-default-rtdb.firebaseio.com",projectId:"ahmed-vip-portal",storageBucket:"ahmed-vip-portal.firebasestorage.app",messagingSenderId:"737002492478",appId:"1:737002492478:web:0273e9d2cd483ae5a8376f",measurementId:"G-WN973QJR0Z"};
const appFB=initializeApp(firebaseConfig);const auth=getAuth(appFB);const db=getDatabase(appFB);
let currentUser=null,currentView='landing',listeners=[],offlineState={players:[],spyCount:1,category:'all',currentReveal:0,location:'',spies:[],timer:300},onlineRoomCode=null;
const locationsDB={all:["مطار بغداد","مدرسة","مستشفى","شاطئ","سفينة فضاء","كوفي شوب","ملعب","سجن","بنك","مطعم","سوق شعبي","مسرح","فندق","محطة قطار","حديقة حيوان","مصنع","مكتبة","صحراء","غابة","جزيرة","استوديو","قصر رئاسي","محكمة","مختبر","مزرعة","ملهى","مسجد","مقبرة","جسر","منجم","غواصة","محطة فضاء","حلبة","سيرك","مدينة ملاهي","كهف","بركان","قاع البحر","تيتانيك","متحف","مخبأ مافيا","كازينو","برج خليفة","الاهرامات","مكة","ساحة التحرير"],دول:["العراق","السعودية","امريكا","اليابان"],مهن:["مستشفى","مدرسة","شرطة"],افلام:["تيتانيك","باتمان"]};
const badWords=["زربة","كس","قحبة","منيك","عرص","fuck","shit","bitch"];
const generateCode=l=>{let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(let i=0;i<l;i++)s+=c[Math.floor(Math.random()*c.length)];return s;};
const generateOTP=()=>Math.floor(100000+Math.random()*900000).toString();
const containsBadWord=t=>badWords.some(w=>t.toLowerCase().includes(w));
const formatTime=s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
const clearListeners=()=>{listeners.forEach(u=>{try{u()}catch{}});listeners=[];};
onAuthStateChanged(auth,async user=>{currentUser=user;if(user){document.getElementById('userBadge').classList.remove('hidden');document.getElementById('userBadge').textContent=user.email+(user.emailVerified?' ✅':' ⚠️');document.getElementById('logoutBtn').classList.remove('hidden');const allAdmins=await get(ref(db,'admins'));if(!allAdmins.exists()||(await get(ref(db,`admins/${user.uid}`))).exists()){document.getElementById('adminBtn').classList.remove('hidden');}update(ref(db,`users/${user.uid}`),{lastLogin:Date.now(),email:user.email});const ban=await get(ref(db,`bans/${user.uid}`));if(ban.exists()&&ban.val().until>Date.now()){alert(`محظور حتى ${new Date(ban.val().until).toLocaleString()}`);await signOut(auth);return;}}else{document.getElementById('userBadge').classList.add('hidden');document.getElementById('logoutBtn').classList.add('hidden');document.getElementById('adminBtn').classList.add('hidden');}render();});
function render(){const app=document.getElementById('app');if(currentView==='landing')app.innerHTML=`<div class="text-center py-10"><h2 class="text-5xl md:text-7xl font-black">لعبة <span class="text-yellow-400">الجاسوس</span><br>الأسطورية</h2><div class="grid md:grid-cols-3 gap-6 mt-12 max-w-5xl mx-auto"><div onclick="setView('offline-setup')" class="glass rounded-[2rem] p-8 cursor-pointer"><div class="text-3xl">📱</div><h3 class="text-2xl font-black mt-2">اوفلاين</h3><div class="mt-6 gold-gradient text-black font-bold py-3 rounded-xl">ابدأ</div></div><div onclick="handleOnline()" class="glass rounded-[2rem] p-8 cursor-pointer border border-cyan-400/20"><div class="text-3xl">🌐</div><h3 class="text-2xl font-black mt-2">اونلاين VIP</h3><div class="mt-6 bg-cyan-400 text-black font-bold py-3 rounded-xl">ادخل</div></div><div onclick="setView('admin')" class="glass rounded-[2rem] p-8 cursor-pointer border border-purple-400/20"><div class="text-3xl">👑</div><h3 class="text-2xl font-black mt-2">لوحة التحكم</h3><div class="mt-6 bg-purple-400 text-black font-bold py-3 rounded-xl">ادمن</div></div></div></div>`;if(currentView==='auth')app.innerHTML=`<div class="max-w-md mx-auto glass rounded-[2rem] p-8 mt-6"><h2 class="text-3xl font-black text-center">VIP</h2><div class="mt-8 space-y-4"><input id="email" type="email" placeholder="ايميلك" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3"><input id="password" type="password" placeholder="باسورد 6+" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3"><input id="otpInput" placeholder="كود 6 ارقام" class="w-full bg-black/40 border border-yellow-400/30 rounded-xl px-4 py-3 hidden"><div id="otpDisplay" class="hidden bg-yellow-400/10 border border-yellow-400/30 rounded-xl p-3 text-center"><p id="otpCode" class="text-2xl font-black text-yellow-400"></p></div><button id="registerBtn" class="w-full gold-gradient text-black font-black py-3 rounded-xl">تسجيل + ارسال كود</button><button id="loginBtn" class="w-full glass py-3 rounded-xl">دخول</button><button id="resendBtn" class="w-full hidden bg-cyan-400/20 py-3 rounded-xl">اعادة ارسال رابط</button><div id="authMsg" class="text-center text-sm"></div><button onclick="setView('landing')" class="w-full text-xs opacity-50">رجوع</button></div></div>`;if(currentView==='offline-setup')app.innerHTML=`<div class="max-w-3xl mx-auto"><h2 class="text-3xl font-black">اوفلاين</h2><div class="glass rounded-[2rem] p-6 mt-6 space-y-4"><div class="grid grid-cols-2 gap-4"><input id="playerCount" type="number" value="${offlineState.players.length||5}" class="bg-black/40 border rounded-xl p-3"><select id="spyCount" class="bg-black/40 border rounded-xl p-3"><option value="1">1 جاسوس</option><option value="2">2</option><option value="3">3</option></select></div><div id="namesBox" class="space-y-2"></div><div class="flex gap-3"><button id="genNames" class="flex-1 glass py-3 rounded-xl">اسماء</button><button id="startOffline" class="flex-1 gold-gradient text-black py-3 rounded-xl font-black">ابدأ 🔥</button></div></div></div>`;if(currentView==='offline-reveal'){const p=offlineState.players[offlineState.currentReveal];app.innerHTML=`<div class="max-w-md mx-auto text-center"><div class="glass rounded-[2rem] p-8 mt-10"><p>${offlineState.currentReveal+1}/${offlineState.players.length}</p><h2 class="text-3xl font-black">${p}</h2><div id="card" class="mt-8 bg-black/50 rounded-[1.5rem] p-8 min-h-[200px] flex items-center justify-center cursor-pointer">اضغط للكشف 👁️</div><button id="nextPlayer" class="hidden w-full mt-6 gold-gradient text-black py-3 rounded-xl font-black">التالي →</button></div></div>`;}if(currentView==='offline-game')app.innerHTML=`<div class="max-w-3xl mx-auto"><div class="flex justify-between"><h2 class="text-2xl font-black">بدأت! 🎯</h2><div id="timer" class="glass px-4 py-2 rounded-full font-mono">${formatTime(offlineState.timer)}</div></div><div class="glass rounded-[2rem] p-6 mt-6"><div class="grid grid-cols-2 gap-3">${offlineState.players.map((n,i)=>`<div class="glass p-4 rounded-xl text-center">${n}</div>`).join('')}</div><div class="flex gap-3 mt-6"><button id="revealAll" class="flex-1 bg-red-500/20 py-3 rounded-xl">كشف 💣</button><button id="backLanding" class="flex-1 glass py-3 rounded-xl">انهاء</button></div></div></div>`;if(currentView==='online'){if(!currentUser)app.innerHTML=`<div class="text-center py-20"><button onclick="setView('auth')" class="gold-gradient px-6 py-2 rounded-full font-black text-black">سجل اولا</button></div>`;else if(!currentUser.emailVerified)app.innerHTML=`<div class="max-w-md mx-auto glass rounded-3xl p-8 text-center mt-10"><h3 class="text-2xl font-black">تحقق ايميلك ✉️</h3><p class="text-sm opacity-70">${currentUser.email}</p><input id="verifyOtp" placeholder="كود 6 ارقام" class="w-full mt-4 bg-black/40 border rounded-xl p-3 text-center"><button id="checkOtp" class="w-full mt-3 gold-gradient text-black py-3 rounded-xl font-black">تحقق</button><button id="resendVerify" class="w-full mt-2 glass py-2 rounded-xl text-sm">اعادة ارسال</button><div id="verifyMsg" class="mt-3 text-sm"></div></div>`;else app.innerHTML=`<div class="max-w-5xl mx-auto"><div class="flex justify-between"><h2 class="text-3xl font-black">اونلاين VIP 🌐</h2><div class="flex gap-2"><input id="joinCode" placeholder="VIP-XXXX" class="bg-black/40 border rounded-xl px-4 py-2 w-32"><button id="joinRoomBtn" class="bg-cyan-400 text-black px-5 py-2 rounded-xl font-black">انضم</button><button id="createRoomBtn" class="gold-gradient text-black px-5 py-2 rounded-xl font-black">+ انشاء</button></div></div><div class="glass rounded-[1.5rem] p-6 mt-6"><h3 class="font-black mb-4">الغرف 🔴</h3><div id="roomsList">تحميل...</div></div></div>`;}if(currentView==='online-room')app.innerHTML=`<div class="max-w-4xl mx-auto glass rounded-[2rem] p-6 text-center">تحميل ${onlineRoomCode}...</div>`;if(currentView==='admin')renderAdmin();attachEvents();}
window.setView=v=>{clearListeners();currentView=v;render();};window.handleOnline=()=>{if(!currentUser)setView('auth');else setView('online');};
function attachEvents(){
document.getElementById('adminBtn')?.addEventListener('click',()=>setView('admin'));
document.getElementById('logoutBtn')?.addEventListener('click',async()=>{await signOut(auth);setView('landing');});
if(currentView==='auth'){
const emailEl=document.getElementById('email'),passEl=document.getElementById('password'),otpInput=document.getElementById('otpInput'),otpDisplay=document.getElementById('otpDisplay'),otpCodeEl=document.getElementById('otpCode'),msg=document.getElementById('authMsg');
document.getElementById('registerBtn')?.addEventListener('click',async()=>{try{msg.textContent='جاري...';const cred=await createUserWithEmailAndPassword(auth,emailEl.value,passEl.value);const otp=generateOTP();await set(ref(db,`verifications/${cred.user.uid}`),{email:emailEl.value,code:otp,createdAt:Date.now(),verified:false});await set(ref(db,`users/${cred.user.uid}`),{email:emailEl.value,createdAt:Date.now(),warnings:0,lastLogin:Date.now()});await sendEmailVerification(cred.user);otpDisplay.classList.remove('hidden');otpInput.classList.remove('hidden');otpCodeEl.textContent=otp;msg.innerHTML=`✅ رابط انرسل + كودك <b>${otp}</b> (يوصل للادمن)`;}catch(e){msg.textContent=e.message;}});
document.getElementById('loginBtn')?.addEventListener('click',async()=>{try{const cred=await signInWithEmailAndPassword(auth,emailEl.value,passEl.value);if(!cred.user.emailVerified){msg.textContent='ايميل غير محقق - شيك بريدك';const v=await get(ref(db,`verifications/${cred.user.uid}`));if(v.exists()){otpDisplay.classList.remove('hidden');otpCodeEl.textContent=v.val().code;otpInput.classList.remove('hidden');}return;}setView('online');}catch(e){msg.textContent=e.message;}});
}
if(currentView==='offline-setup'){
const countInput=document.getElementById('playerCount'),namesBox=document.getElementById('namesBox');
function gen(){let n=parseInt(countInput.value)||5,h='';for(let i=0;i<n;i++)h+=`<input data-name="${i}" value="لاعب ${i+1}" class="w-full bg-black/30 border rounded-xl p-2">`;namesBox.innerHTML=h;}gen();countInput.addEventListener('input',gen);
document.getElementById('startOffline').addEventListener('click',()=>{offlineState.players=Array.from(document.querySelectorAll('[data-name]')).map(i=>i.value);offlineState.spyCount=parseInt(document.getElementById('spyCount').value);const list=locationsDB.all;offlineState.location=list[Math.floor(Math.random()*list.length)];offlineState.spies=[];while(offlineState.spies.length<offlineState.spyCount){let r=Math.floor(Math.random()*offlineState.players.length);if(!offlineState.spies.includes(r))offlineState.spies.push(r);}offlineState.currentReveal=0;offlineState.timer=300;setView('offline-reveal');});
}
if(currentView==='offline-reveal'){
let rev=false;document.getElementById('card').addEventListener('click',()=>{if(rev)return;rev=true;const isSpy=offlineState.spies.includes(offlineState.currentReveal);const card=document.getElementById('card');card.innerHTML=isSpy?`<div class="text-center"><div class="text-6xl">🕵️</div><h3 class="text-3xl font-black text-red-400">أنت الجاسوس!</h3></div>`:`<div class="text-center"><div class="text-6xl">📍</div><h3 class="text-2xl font-black text-green-400">${offlineState.location}</h3></div>`;document.getElementById('nextPlayer').classList.remove('hidden');});
document.getElementById('nextPlayer').addEventListener('click',()=>{offlineState.currentReveal++;if(offlineState.currentReveal>=offlineState.players.length)setView('offline-game');else render();});
}
if(currentView==='offline-game'){
let iv=setInterval(()=>{offlineState.timer--;let el=document.getElementById('timer');if(el)el.textContent=formatTime(offlineState.timer);},1000);
document.getElementById('revealAll').addEventListener('click',()=>alert(`جواسيس: ${offlineState.spies.map(i=>offlineState.players[i]).join(', ')}\nمكان: ${offlineState.location}`));
document.getElementById('backLanding').addEventListener('click',()=>{clearInterval(iv);setView('landing');});
}
if(currentView==='online'){
document.getElementById('checkOtp')?.addEventListener('click',async()=>{const code=document.getElementById('verifyOtp').value;const snap=await get(ref(db,`verifications/${currentUser.uid}`));if(snap.val().code===code){await update(ref(db,`verifications/${currentUser.uid}`),{verified:true});document.getElementById('verifyMsg').textContent='✅ تم';setTimeout(()=>location.reload(),1000);}else document.getElementById('verifyMsg').textContent='❌ غلط';});
document.getElementById('createRoomBtn')?.addEventListener('click',async()=>{const code='VIP-'+generateCode(4);onlineRoomCode=code;await set(ref(db,`rooms/${code}`),{code,hostUid:currentUser.uid,hostName:currentUser.email.split('@')[0],status:'waiting',createdAt:Date.now(),settings:{spyCount:1,time:300},players:{[currentUser.uid]:{name:currentUser.email.split('@')[0],uid:currentUser.uid,isHost:true,ready:false,isSpy:false,word:''}},chat:[]});setView('online-room');attachRoomListener(code);});
document.getElementById('joinRoomBtn')?.addEventListener('click',async()=>{const code=document.getElementById('joinCode').value.toUpperCase();const snap=await get(ref(db,`rooms/${code}`));if(!snap.exists())return alert('ماكو غرفة');await update(ref(db,`rooms/${code}/players/${currentUser.uid}`),{name:currentUser.email.split('@')[0],uid:currentUser.uid,isHost:false,ready:false});onlineRoomCode=code;setView('online-room');attachRoomListener(code);});
const roomsRef=ref(db,'rooms');onValue(roomsRef,snap=>{const list=document.getElementById('roomsList');if(!list)return;const val=snap.val();if(!val){list.innerHTML='ماكو غرف';return;}list.innerHTML=Object.values(val).filter(r=>r.status==='waiting').map(r=>`<div class="flex justify-between glass p-3 rounded-xl mb-2"><span><b class="text-cyan-400">${r.code}</b> - ${r.hostName} - ${Object.keys(r.players||{}).length}</span><button data-join="${r.code}" class="joinBtn bg-cyan-400 text-black px-3 py-1 rounded-full text-xs">انضم</button></div>`).join('');list.querySelectorAll('.joinBtn').forEach(b=>b.addEventListener('click',async e=>{const code=e.target.dataset.join;await update(ref(db,`rooms/${code}/players/${currentUser.uid}`),{name:currentUser.email.split('@')[0],uid:currentUser.uid,isHost:false,ready:false});onlineRoomCode=code;setView('online-room');attachRoomListener(code);}));});listeners.push(()=>off(roomsRef));
}
if(currentView==='online-room'&&onlineRoomCode)attachRoomListener(onlineRoomCode);
}
function attachRoomListener(code){
clearListeners();const roomRef=ref(db,`rooms/${code}`);
onValue(roomRef,snap=>{
if(!snap.exists()){alert('انحذفت');setView('online');return;}
const room=snap.val(),players=Object.values(room.players||{}),me=room.players?.[currentUser?.uid],isHost=room.hostUid===currentUser?.uid;
document.getElementById('app').innerHTML=`<div class="max-w-5xl mx-auto"><div class="flex justify-between"><h2 class="text-2xl font-black">غرفة ${room.code}</h2><div class="flex gap-2"><button id="leaveRoom" class="glass px-4 py-2 rounded-full text-sm">خروج</button>${isHost?`<button id="deleteRoom" class="bg-red-500/20 px-4 py-2 rounded-full text-sm">حذف</button>`:''}</div></div><div class="grid md:grid-cols-3 gap-6 mt-6"><div class="md:col-span-2 space-y-4"><div class="glass rounded-2xl p-5"><div class="flex justify-between mb-4"><h3 class="font-black">لاعبين (${players.length})</h3>${isHost&&room.status==='waiting'?`<button id="startGame" class="gold-gradient text-black px-5 py-2 rounded-xl font-black text-sm">ابدأ 🚀</button>`:''}</div><div class="grid grid-cols-2 gap-3">${players.map(p=>`<div class="glass p-3 rounded-xl">${p.isHost?'👑':''} ${p.name} ${p.ready?'✅':''}</div>`).join('')}</div>${room.status==='waiting'?`<button id="readyBtn" class="w-full mt-4 ${me?.ready?'bg-green-500':'glass'} py-3 rounded-xl font-bold">${me?.ready?'✅ جاهز':'جاهز'}</button>`:''}</div>${room.status==='playing'?`<div class="glass rounded-2xl p-5 text-center"><h3 class="font-black">دورك</h3><div class="mt-3 p-6 rounded-xl ${me?.isSpy?'bg-red-500/20 border border-red-400/30':'bg-green-500/20 border border-green-400/30'}">${me?.isSpy?`🕵️<p class="text-2xl font-black text-red-400 mt-2">أنت الجاسوس!</p>`:`📍<p class="text-2xl font-black text-green-400 mt-2">${me?.word}</p>`}</div></div>`:''}<div class="glass rounded-2xl p-5"><h3 class="font-black mb-3">شات 💬</h3><div id="chatBox" class="h-48 overflow-y-auto bg-black/30 rounded-xl p-3 text-sm">${(room.chat||[]).slice(-20).map(c=>`<div><b class="text-yellow-400">${c.name}:</b> ${c.text}</div>`).join('')}</div><div class="flex gap-2 mt-3"><input id="chatInput" placeholder="اكتب..." class="flex-1 bg-black/40 border rounded-xl px-4 py-2 text-sm"><button id="sendChat" class="bg-cyan-400 text-black px-4 py-2 rounded-xl text-sm">ارسال</button></div></div></div><div class="glass rounded-2xl p-5"><p class="text-xs font-bold text-yellow-400">🛡️ حماية نشطة - اي سب = حظر</p></div></div></div>`;
document.getElementById('leaveRoom')?.addEventListener('click',async()=>{await remove(ref(db,`rooms/${code}/players/${currentUser.uid}`));clearListeners();setView('online');});
document.getElementById('deleteRoom')?.addEventListener('click',async()=>{if(confirm('تحذف؟')){await remove(roomRef);setView('online');}});
document.getElementById('readyBtn')?.addEventListener('click',async()=>{await update(ref(db,`rooms/${code}/players/${currentUser.uid}`),{ready:!me?.ready});});
document.getElementById('startGame')?.addEventListener('click',async()=>{const uids=Object.keys(room.players);const loc=locationsDB.all[Math.floor(Math.random()*locationsDB.all.length)];const shuffled=[...uids].sort(()=>Math.random()-0.5);const spies=shuffled.slice(0,1);for(const uid of uids){await update(ref(db,`rooms/${code}/players/${uid}`),{isSpy:spies.includes(uid),word:spies.includes(uid)?'':loc});}await update(roomRef,{status:'playing',location:loc,spyUids:spies});});
document.getElementById('sendChat')?.addEventListener('click',sendChat);document.getElementById('chatInput')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
async function sendChat(){const input=document.getElementById('chatInput'),text=input.value.trim();if(!text)return;if(containsBadWord(text)){const wRef=ref(db,`users/${currentUser.uid}/warnings`);const s=await get(wRef);let w=(s.val()||0)+1;await set(wRef,w);let dur=w==1?10*60*1000:w==2?60*60*1000:24*60*60*1000;await set(ref(db,`bans/${currentUser.uid}`),{until:Date.now()+dur,reason:`سب: ${text}`});await push(ref(db,'reports'),{email:currentUser.email,text,time:Date.now()});alert(`انحظرت ${dur/60000} دقيقة`);await signOut(auth);setView('landing');return;}const chat=room.chat||[];chat.push({name:me?.name,text,time:Date.now()});await update(roomRef,{chat:chat.slice(-100)});input.value='';}
});listeners.push(()=>off(roomRef));
}
async function renderAdmin(){
const app=document.getElementById('app');
if(!currentUser){app.innerHTML='<div class="text-center py-20">سجل دخول اولا</div>';return;}
const allAdmins=await get(ref(db,'admins'));if(!allAdmins.exists())await set(ref(db,`admins/${currentUser.uid}`),true);
const check=await get(ref(db,`admins/${currentUser.uid}`));if(!check.exists()){app.innerHTML=`<div class="glass p-10 text-center mt-10 max-w-xl mx-auto">⛔ مو ادمن<br>${currentUser.email}<br>اضف /admins/${currentUser.uid}=true</div>`;return;}
app.innerHTML=`<div class="max-w-7xl mx-auto"><h2 class="text-4xl font-black">لوحة VIP 👑</h2><div class="grid grid-cols-4 gap-4 mt-6"><div class="glass p-4 rounded-2xl"><p class="text-xs opacity-60">مستخدمين</p><p id="statUsers" class="text-2xl font-black">-</p></div><div class="glass p-4 rounded-2xl"><p class="text-xs opacity-60">غرف</p><p id="statRooms" class="text-2xl font-black">-</p></div><div class="glass p-4 rounded-2xl"><p class="text-xs opacity-60">محظورين</p><p id="statBans" class="text-2xl font-black">-</p></div><div class="glass p-4 rounded-2xl"><p class="text-xs opacity-60">اكواد</p><p id="statCodes" class="text-2xl font-black">-</p></div></div><div class="flex gap-2 mt-6 overflow-x-auto"><button data-tab="users" class="tabBtn bg-yellow-400 text-black px-5 py-2 rounded-full text-sm font-black">مستخدمين</button><button data-tab="verifs" class="tabBtn glass px-5 py-2 rounded-full text-sm">اكواد</button><button data-tab="rooms" class="tabBtn glass px-5 py-2 rounded-full text-sm">غرف</button><button data-tab="bans" class="tabBtn glass px-5 py-2 rounded-full text-sm">حظر</button><button data-tab="reports" class="tabBtn glass px-5 py-2 rounded-full text-sm">بلاغات</button></div><div id="adminContent" class="mt-6 glass rounded-[1.5rem] p-6 min-h-[300px]"></div></div>`;
const tabs=document.querySelectorAll('.tabBtn');tabs.forEach(b=>b.addEventListener('click',e=>{tabs.forEach(x=>x.className='tabBtn glass px-5 py-2 rounded-full text-sm');e.target.className='tabBtn bg-yellow-400 text-black px-5 py-2 rounded-full text-sm font-black';loadTab(e.target.dataset.tab);}));
function loadTab(tab){const c=document.getElementById('adminContent');if(tab==='users'){onValue(ref(db,'users'),s=>{const v=s.val()||{};document.getElementById('statUsers').textContent=Object.keys(v).length;c.innerHTML=`<table class="w-full text-sm"><tr class="opacity-50"><th class="text-right p-2">ايميل</th><th>تحذير</th><th>اجراء</th></tr>${Object.entries(v).map(([uid,u])=>`<tr class="border-t border-white/10"><td class="p-2">${u.email}</td><td>${u.warnings||0}</td><td class="flex gap-1"><button data-ban10="${uid}" class="bg-yellow-400/20 px-2 py-1 rounded text-xs">10د</button><button data-ban60="${uid}" class="bg-orange-400/20 px-2 py-1 rounded text-xs">ساعة</button><button data-ban1440="${uid}" class="bg-red-400/20 px-2 py-1 rounded text-xs">يوم</button><button data-unban="${uid}" class="bg-green-400/20 px-2 py-1 rounded text-xs">فك</button><button data-makeAdmin="${uid}" class="glass px-2 py-1 rounded text-xs">ادمن</button></td></tr>`).join('')}</table>`;c.querySelectorAll('[data-ban10]').forEach(b=>b.addEventListener('click',async e=>{await set(ref(db,`bans/${e.target.dataset.ban10}`),{until:Date.now()+10*60*1000,reason:'ادمن'});alert('تم');}));c.querySelectorAll('[data-ban60]').forEach(b=>b.addEventListener('click',async e=>{await set(ref(db,`bans/${e.target.dataset.ban60}`),{until:Date.now()+60*60*1000,reason:'ادمن'});alert('تم');}));c.querySelectorAll('[data-ban1440]').forEach(b=>b.addEventListener('click',async e=>{await set(ref(db,`bans/${e.target.dataset.ban1440}`),{until:Date.now()+24*60*60*1000,reason:'ادمن'});alert('تم');}));c.querySelectorAll('[data-unban]').forEach(b=>b.addEventListener('click',async e=>{await remove(ref(db,`bans/${e.target.dataset.unban}`));}));c.querySelectorAll('[data-makeAdmin]').forEach(b=>b.addEventListener('click',async e=>{await set(ref(db,`admins/${e.target.dataset.makeAdmin}`),true);alert('ادمن');}));});}if(tab==='verifs'){onValue(ref(db,'verifications'),s=>{const v=s.val()||{};document.getElementById('statCodes').textContent=Object.keys(v).length;c.innerHTML=Object.entries(v).map(([uid,o])=>`<div class="glass p-3 rounded-xl flex justify-between mb-2"><div><b>${o.email}</b><p class="text-xs opacity-60">${new Date(o.createdAt).toLocaleString()} ${o.verified?'✅':''}</p></div><div class="text-2xl font-black text-yellow-400">${o.code}</div></div>`).join('')||'ماكو';});}if(tab==='rooms'){onValue(ref(db,'rooms'),s=>{const v=s.val()||{};document.getElementById('statRooms').textContent=Object.keys(v).length;c.innerHTML=Object.values(v).map(r=>`<div class="glass p-3 rounded-xl flex justify-between mb-2"><span><b class="text-cyan-400">${r.code}</b> - ${r.hostName}</span><button data-del="${r.code}" class="bg-red-500/20 px-3 py-1 rounded-full text-xs">حذف</button></div>`).join('')||'ماكو';c.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async e=>{await remove(ref(db,`rooms/${e.target.dataset.del}`));}));});}if(tab==='bans'){onValue(ref(db,'bans'),s=>{const v=s.val()||{};document.getElementById('statBans').textContent=Object.keys(v).length;c.innerHTML=Object.entries(v).map(([uid,b])=>`<div class="glass p-3 rounded-xl flex justify-between mb-2"><div>${uid}<p class="text-xs opacity-60">${b.reason} - ${new Date(b.until).toLocaleString()}</p></div><button data-un="${uid}" class="bg-green-400/20 px-3 py-1 rounded-full text-xs">فك</button></div>`).join('')||'ماكو';c.querySelectorAll('[data-un]').forEach(b=>b.addEventListener('click',async e=>{await remove(ref(db,`bans/${e.target.dataset.un}`));}));});}if(tab==='reports'){onValue(ref(db,'reports'),s=>{const v=s.val()||{};c.innerHTML=Object.values(v).reverse().map(r=>`<div class="glass p-3 rounded-xl mb-2"><b>${r.email}:</b> ${r.text}<p class="text-[10px] opacity-50">${new Date(r.time).toLocaleString()}</p></div>`).join('')||'ماكو';});}}
loadTab('users');
}
render();
</script>
</body>
