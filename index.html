function playLose(){ if(!s.sound || !audioCtx) return; try{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.frequency.setValueAtTime(250, audioCtx.currentTime); o.frequency.linearRampToValueAtTime(80, audioCtx.currentTime+0.4); g.gain.setValueAtTime(0.15, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime+0.4); o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.4);}catch(e){} }
window.toggleSound=()=>{ s.sound=!s.sound; render(); };

async function getIP(){ try{ const r=await fetch('https://api.ipify.org?format=json'); const j=await r.json(); s.ip=j.ip; return j.ip; }catch{ s.ip=''; return ''; } }
function wrand(){ let t=s.prizes.reduce((a,b)=>a+b.weight,0); let r=Math.random()*t; let c=0; for(let i=0;i<s.prizes.length;i++){ c+=s.prizes[i].weight; if(r<=c) return i; } return s.prizes.length-1; }
